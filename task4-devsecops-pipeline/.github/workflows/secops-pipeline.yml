name: DevSecOps Secure CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Security Scanners (Bandit & Safety)
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Static Application Security Testing (SAST) via Bandit
        run: |
          bandit -r . -ll -ii || true

      - name: Run Dependency Vulnerability Check via Safety
        run: |
          safety check || true
